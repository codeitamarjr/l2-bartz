# Server rates, matching the landing page: Experience x10, Adena x5, Drop x3, Raid Boss x1.
# Only the keys that differ from L2J's retail defaults (x1) live here; the entrypoint merges them into
# config/rates.properties at start. Apply changes with: docker compose restart game
#
# How L2J combines these (model/drops/strategy/*MultiplierStrategy.java): each drop uses ONE multiplier,
# picked in this order: per-item list (adena) > herbs > raid bosses > the general death/spoil multiplier.
# So the adena and raid values below are exact and never stack with the x3 drop rate.

# --- Experience x10 ---------------------------------------------------------
# SP follows XP so skills keep pace with levels.
RateXp = 10
RateSp = 10
# Party XP/SP are a bonus applied ON TOP of RateXp/RateSp (L2Party.java), so they stay at 1.
# Setting them to 10 would give parties 100x.
RatePartyXp = 1
RatePartySp = 1
# Quest XP/SP rewards follow the experience rate.
RateQuestRewardXP = 10
RateQuestRewardSP = 10

# --- Adena x5 ---------------------------------------------------------------
# Adena (item 57) uses its own multiplier: x5 amount, normal chance.
DropAmountMultiplierByItemId = 57,5
DropChanceMultiplierByItemId = 57,1
# Quest adena rewards follow the adena rate.
RateQuestRewardAdena = 5

# --- Drop x3 ----------------------------------------------------------------
# Raise the chance, not the amount: x3 chance means three times as many drops, while also raising the
# amount would multiply (3 * 3 = 9x). Spoil (Sweeper) follows drop so Dwarves keep up.
DeathDropChanceMultiplier = 3
DeathDropAmountMultiplier = 1
CorpseDropChanceMultiplier = 3
CorpseDropAmountMultiplier = 1

# --- Raid Boss x1 -----------------------------------------------------------
# Raid and grand bosses (Antharas, Valakas, Baium, Freya...) stay retail.
RaidDropChanceMultiplier = 1
RaidDropAmountMultiplier = 1

# Left at retail on purpose: herbs, manor, extractables, quest item drops (L2J warns many quests
# break with other values), karma, pets.
