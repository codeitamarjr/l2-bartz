# Geodata settings for when data/geodata/ holds the L2J High Five geodata (l2jgeo/l2j_geodata, *.l2j).
# Only keys that differ from the L2J defaults; merged into config/geodata.properties at start.

# 2 = pathfinding computed from the geodata cells at runtime: monsters and players walk around walls
# instead of getting stuck. Needs no extra pathnode files (1 would). Default 0 = disabled.
PathFinding = 2

# 2 = intended for geodata with cell pathfinding (per the L2J comments): the server corrects clients
# that drift through obstacles. Default -1 is meant for servers without geodata.
CoordSynchronize = 2
