server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	add_header X-Content-Type-Options nosniff always;
	add_header X-Frame-Options DENY always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;

	location / {
		try_files $uri $uri/ =404;
	}

	# Images and video are cached; CSS/JS are revalidated so edits show up on refresh.
	location /assets/ {
		expires 7d;
	}

	location ~* \.(css|js)$ {
		expires -1;
	}

	# Stats API (api service) for the About page. Resolved per request through Docker's DNS, so nginx
	# still starts when the api container is down (the page then shows the status as unavailable).
	location /api/ {
		# The API only takes tiny JSON bodies (sign-in).
		client_max_body_size 4k;
		resolver 127.0.0.11 valid=10s ipv6=off;
		set $api_upstream http://api:3000;
		proxy_pass $api_upstream;
		# $http_host keeps the port, so the API's same-site check sees the same host as the browser's Origin.
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_connect_timeout 3s;
		proxy_read_timeout 10s;
	}
}
